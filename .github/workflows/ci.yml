name: CI

env:
  LLVM_MINGW_VERSION: 20260922
  RUST_VERSION: 1.97.1

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:44
    name: Build
    steps:
      - name: Cache llvm-mingw
        id: cache-llvm-linux
        uses: actions/cache@v6
        with:
          path: /opt/llvm-mingw
          key: llvm-mingw-${{ runner.os }}-${{ env.LLVM_MINGW_VERSION }}
      - name: Install llvm-mingw ${{ env.LLVM_MINGW_VERSION }}
        if: steps.cache-llvm-linux.outputs.cache-hit != 'true'
        run: |
          mkdir -p /opt/llvm-mingw
          cd /opt/llvm-mingw
          curl -L https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz | tar xJ --strip-components=1
      - name: Setup llvm-mingw
        run: |
          echo "/opt/llvm-mingw/bin" >> $GITHUB_PATH
      - name: Install build dependencies
        run: |
          sudo dnf -y install clang rustup git msitools nodejs npm
          rustup-init -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Setup rust targets
        run: |
          rustup set auto-self-update disable
          rustup default $RUST_VERSION
          rustup target add i686-pc-windows-gnullvm
          rustup target add x86_64-pc-windows-gnullvm

      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      # Codeberg downloads are slow; the cache key follows the pinned checksum.
      - name: Cache dictionary
        uses: actions/cache@v6
        with:
          path: .cache
          key: dictionary-${{ hashFiles('xtask/src/download.rs') }}

      # The MSI takes its version from the workspace and the DLL from
      # version.rc (cargo xtask update-version), not from the tag.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pkgid=$(cargo pkgid -p xtask)
          test "$GITHUB_REF_NAME" = "v${pkgid##*[#@]}"
          grep -qF "\"${GITHUB_REF_NAME#v}.0\\0\"" tip/rc/version.rc

      - name: Build the MSI
        run: cargo xtask dist --release --target gnullvm --msi

      - uses: actions/upload-artifact@v7
        with:
          name: InputMethodEditor-msi
          path: dist/InputMethodEditor.msi
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release
          path: dist/InputMethodEditor.msi

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
