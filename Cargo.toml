[workspace]
resolver = "3"
members = [
  "apps/settings",
  "crates/chewing_tip_core",
  "crates/tsfreg",
  "tip",
  "vendor/libchewing",
  "xtask"
]
# A dependency patched below, not one of ours.
exclude = ["vendor/i-slint-renderer-software"]

[workspace.package]
version = "0.7.0"

[workspace.dependencies]
anyhow = "1"
chewing = "0.14.0-alpha.2"
embed-resource = "3.0.1"
log = "0.4.29"
scoped-error = "0.1.0"
serde = { version = "1.0.228", features = ["derive"] }

[profile.release]
debug = true
lto = "thin"
panic = "abort"

[patch."crates-io"]
# Pinyin needs matching libchewing's API can't express (see docs DESIGN.md).
chewing = { path = "vendor/libchewing" }
# chewing = { git = "https://codeberg.org/chewing/libchewing.git" }
# chewing = { path = "../libchewing/" }
# Draws emoji in their colors, which the software renderer draws in the
# text's; the settings app can't use Skia, which has no gnullvm build.
i-slint-renderer-software = { path = "vendor/i-slint-renderer-software" }
